timesteps: [0, 250]

name: "${dataset}_${exp_setting}_ubp_finetune_attn_${brain_backbone}_${vision_backbone}"

# Neural encoder
models:
  brain:
    target: "base.eeg_encoder.${brain_backbone}"
    params:
        c_num: 17
        z_dim: ${z_dim}
        timesteps: ${timesteps}
        use_denoising: true
        ib_beta: 0.01
        learnable_scales: true

# Preprocessed data and retrieval batches
data:
  data_dir: data/things-eeg/Preprocessed_data_250Hz_whiten
  selected_ch: ['P7', 'P5', 'P3', 'P1', 'Pz', 'P2', 'P4', 'P6', 'P8',
                'PO7', 'PO3', 'POz', 'PO4', 'PO8', 'O1', 'Oz', 'O2']

  model_type: ${vision_backbone}
  pretrained: openai

  train_batch_size: 128
  validation_classes: 200
  validation_seed: 0
  val_batch_size: 200
  test_batch_size: 200

  train_avg: True
  test_avg: True
  timesteps: ${timesteps}

  num_workers: 0

# Neural-conditioned visual fusion
attention:
  eeg_dim: ${z_dim}
  img_channels: 3

# Optimization and auxiliary loss weights
train:
  epoch: ${epoch}
  optimizer: AdamW
  lr: ${lr}
  weight_decay: 1e-4
  boundary_weight: 0.01
  warmup_epochs: 0

use_denoising: true

loss:
  boundary_alpha: 0.05

save_dir: 'exp/caia'
